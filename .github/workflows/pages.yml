name: Deploy labs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (each labN/web -> _site/labN, labN/src -> _site/labN/src)
        run: |
          for dir in lab*/; do
            lab="${dir%/}"
            [ -f "$lab/web/index.html" ] || continue
            mkdir -p "_site/$lab"
            cp -R "$lab/web/." "_site/$lab/"
            if [ -d "$lab/src" ]; then cp -R "$lab/src" "_site/$lab/src"; fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
